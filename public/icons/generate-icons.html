<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pinchy PWA Icon Generator</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }
    h1 { color: #ff6b6b; }
    .icon-preview {
      background: #0f0f0f;
      border: 1px solid #333;
      border-radius: 12px;
      margin: 1rem;
      display: inline-block;
    }
    canvas { display: block; }
    button {
      background: #ff6b6b;
      color: #fff;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      margin: 0.5rem;
    }
    button:hover { background: #ff5252; }
    .instructions {
      max-width: 600px;
      background: #252525;
      padding: 1.5rem;
      border-radius: 12px;
      margin-top: 2rem;
      line-height: 1.6;
    }
    code {
      background: #333;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <h1>Pinchy Icon Generator</h1>
  <p>Click a button below to download the corresponding PWA icon as a PNG file.</p>

  <div>
    <div class="icon-preview">
      <canvas id="canvas192" width="192" height="192"></canvas>
    </div>
    <div class="icon-preview">
      <canvas id="canvas512" width="512" height="512"></canvas>
    </div>
  </div>

  <div>
    <button onclick="download(192)">Download icon-192.png</button>
    <button onclick="download(512)">Download icon-512.png</button>
  </div>

  <div class="instructions">
    <h3>Instructions</h3>
    <ol>
      <li>Click each download button above.</li>
      <li>Save the files as <code>icon-192.png</code> and <code>icon-512.png</code>.</li>
      <li>Place them in <code>public/icons/</code> in the project directory, replacing the placeholder files.</li>
    </ol>
  </div>

  <script>
    function drawIcon(canvas, size) {
      const ctx = canvas.getContext('2d');
      const r = size * 0.125; // corner radius proportional to size

      // Rounded rectangle background
      ctx.beginPath();
      ctx.moveTo(r, 0);
      ctx.lineTo(size - r, 0);
      ctx.quadraticCurveTo(size, 0, size, r);
      ctx.lineTo(size, size - r);
      ctx.quadraticCurveTo(size, size, size - r, size);
      ctx.lineTo(r, size);
      ctx.quadraticCurveTo(0, size, 0, size - r);
      ctx.lineTo(0, r);
      ctx.quadraticCurveTo(0, 0, r, 0);
      ctx.closePath();
      ctx.fillStyle = '#0f0f0f';
      ctx.fill();

      // Crab emoji
      ctx.font = `${size * 0.6}px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('\u{1F980}', size / 2, size / 2);
    }

    function download(size) {
      const canvas = document.getElementById(`canvas${size}`);
      const link = document.createElement('a');
      link.download = `icon-${size}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    // Draw both icons on load
    drawIcon(document.getElementById('canvas192'), 192);
    drawIcon(document.getElementById('canvas512'), 512);
  </script>
</body>
</html>
